name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Transfer the existing portfolio into the repository
        if: ${{ hashFiles('portfolio-source.txt') != '' }}
        run: |
          base64 --decode portfolio-source.txt > "$RUNNER_TEMP/portfolio.zip"
          unzip -tq "$RUNNER_TEMP/portfolio.zip"
          unzip -q "$RUNNER_TEMP/portfolio.zip" -d "$GITHUB_WORKSPACE"
          rm portfolio-source.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Import the approved portfolio source files"
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
        id: pages
      - name: Install Pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
      - name: Build website
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build.py --base-url "$SITE_BASE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
